    <script>
      (function () {
        try {
          const allowedThemes = [
            "emerald",
            "light",
            "corporate",
            "synthwave",
            "dark",
            "black",
            "business",
            "night",
            "dim",
            "abyss",
            "bumblebee",
            "caramellatte",
            "nord",
            "cupcake",
            "retro",
            "cyberpunk",
            "valentine",
            "halloween",
            "garden",
            "forest",
            "aqua",
            "lofi",
            "pastel",
            "fantasy",
            "wireframe",
            "luxury",
            "dracula",
            "cmyk",
            "autumn",
            "acid",
            "lemonade",
            "coffee",
            "winter",
            "sunset",
          ];
          const storedTheme = localStorage.getItem("theme");
          const osPrefersDark = window.matchMedia(
            "(prefers-color-scheme: dark)",
          ).matches;

          let initialTheme =
            storedTheme || (osPrefersDark ? "dracula" : "cmyk");

          if (!allowedThemes.includes(initialTheme)) {
            initialTheme = "dim";
          }

          document.documentElement.setAttribute("data-theme", initialTheme);

          const metaThemeColor = document.getElementById("theme-color-meta");
          if (metaThemeColor) {
            metaThemeColor.setAttribute(
              "content",
              initialTheme === "dracula" ? "#282a36" : "#ffffff",
            );
          }
        } catch (e) {}
      })();
    </script>
